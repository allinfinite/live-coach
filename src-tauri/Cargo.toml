[package]
name = "live-coach"
version = "0.2.0"
edition = "2021"
license = "MIT"
build = "build.rs"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
cpal = "0.15.3"
futures-util = "0.3"
ringbuf = "0.4.8"
cidre = { git = "https://github.com/yury/cidre", rev = "a9587fa", features = ["av"] }
ort = { version = "=2.0.0-rc.10" }
ndarray = "0.16"
once_cell = "1"
regex = "1"
thiserror = "2"
rubato = "0.15"
whisper-rs = { version = "0.13.2", features = ["metal"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
security-framework = "3"
hound = "3.5"
libc = "0.2"
toml = "0.8"
[dev-dependencies]
